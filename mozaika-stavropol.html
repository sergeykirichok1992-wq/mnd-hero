<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Видео-отзывы Ставрополя - мозаика 16:9</title>
<!--
  Мозаика видео-отзывов Ставрополя — кадр 16:9 для записи экрана в рекламный
  ролик (просьба Серёги 26.09.2026). Людям не показывается: noindex, ссылок
  на неё нет. Кадр считается в пикселях 4К (3840x2160) и вписывается в окно;
  если окно не 16:9 — по краям чёрные поля, их срезать при монтаже.

  Список окон и ролики собирает sayt-nn/instrumenty/mozaika_stavropol.py
  (репозиторий МНД): там раскладка и какой ролик в каком окне.

  Клавиши: F — во весь экран, пробел — пауза, ← → — медленнее / быстрее.
  Скорость с порога: ?skorost=240 (пикселей 4К в секунду, 240 — кадр проезжает за 16 с,
  вся мозаика — за 50 с).
-->
<style>
html, body{margin:0; height:100%; overflow:hidden; background:#000}
body.tiho, body.tiho *{cursor:none}
#kadr{
  position:absolute; overflow:hidden;
  /* Любимый фон Серёги — тёмно-синий с лиловым отблеском; видно только в щелях. */
  background:
    radial-gradient(40% 60% at 18% 30%, rgba(88,52,160,.55), rgba(88,52,160,0) 70%),
    radial-gradient(45% 55% at 80% 75%, rgba(40,60,170,.55), rgba(40,60,170,0) 70%),
    #050922;
}
.o{
  position:absolute; left:0; top:0; overflow:hidden;
  border-radius:calc(22px * var(--k)); background:#0B1450;
  will-change:transform;
}
.o video{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  object-fit:cover; border-radius:inherit;
}
/* Большие окна — с тонкой золотой кромкой и тёплым ореолом, чтобы выделялись. */
.o.b{box-shadow:0 0 calc(34px * var(--k)) rgba(245,158,11,.28); z-index:2}
.o.b::after{
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 0 calc(3px * var(--k)) rgba(240,201,122,.9);
}
#podskazka{
  position:fixed; left:50%; bottom:24px; z-index:10; transform:translateX(-50%);
  padding:10px 18px; border-radius:999px;
  background:rgba(4,7,26,.82); color:#fff;
  font:500 15px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  white-space:nowrap; pointer-events:none;
  transition:opacity .6s ease;
}
#podskazka.skryt{opacity:0}
</style>
</head>
<body>
<div id="kadr" aria-label="Видео-отзывы родителей с площадки Ставрополя"></div>
<div id="podskazka">Загружаю ролики…</div>
<script>
(function(){
  /* [столбец, ряд, размер в клетках, файл без расширения] — вписывает скрипт */
  var OKNA = /*OKNA*/[
  [0,0,1,'vo-mozaika/mz-01'],
  [0,1,1,'vo-mozaika/mz-02'],
  [0,2,1,'vo-mozaika/mz-03'],
  [0,3,1,'vo-mozaika/mz-04'],
  [0,4,1,'vo-mozaika/mz-05'],
  [1,0,1,'vo-mozaika/mz-06'],
  [1,1,3,'vo-mozaika/mz-07'],
  [1,4,1,'vo-mozaika/mz-08'],
  [2,0,1,'vo-mozaika/mz-09'],
  [2,4,1,'vo-mozaika/mz-10'],
  [3,0,1,'vo-mozaika/mz-11'],
  [3,4,1,'vo-mozaika/mz-12'],
  [4,0,1,'vo-mozaika/mz-13'],
  [4,1,1,'vo-mozaika/mz-14'],
  [4,2,1,'vo-mozaika/mz-15'],
  [4,3,1,'vo-mozaika/mz-16'],
  [4,4,1,'vo-mozaika/mz-17'],
  [5,0,2,'vo-mozaika/mz-18'],
  [5,2,1,'vo-mozaika/mz-19'],
  [5,3,1,'vo-mozaika/mz-20'],
  [5,4,1,'vo-mozaika/mz-21'],
  [6,2,1,'vo-mozaika/mz-22'],
  [6,3,2,'vo-mozaika/mz-23'],
  [7,0,1,'vo-mozaika/mz-24'],
  [7,1,1,'vo-mozaika/mz-25'],
  [7,2,1,'vo-mozaika/mz-26'],
  [8,0,1,'vo-mozaika/mz-27'],
  [8,1,1,'vo-mozaika/mz-28'],
  [8,2,1,'vo-mozaika/mz-29'],
  [8,3,1,'vo-mozaika/mz-30'],
  [8,4,1,'vo-mozaika/mz-31'],
  [9,0,3,'vo-mozaika/mz-32'],
  [9,3,1,'vo-mozaika/mz-33'],
  [9,4,1,'vo-mozaika/mz-34'],
  [10,3,1,'vo-mozaika/mz-35'],
  [10,4,1,'vo-mozaika/mz-36'],
  [11,3,1,'vo-mozaika/mz-37'],
  [11,4,1,'vo-mozaika/mz-38'],
  [12,0,1,'vo-mozaika/mz-39'],
  [12,1,1,'vo-mozaika/mz-40'],
  [12,2,1,'vo-mozaika/mz-41'],
  [12,3,2,'vo-mozaika/mz-42'],
  [13,0,1,'vo-mozaika/mz-43'],
  [13,1,1,'vo-mozaika/mz-44'],
  [13,2,1,'vo-mozaika/mz-45'],
  [14,0,1,'vo-mozaika/mz-46'],
  [14,1,2,'vo-mozaika/mz-47'],
  [14,3,1,'vo-mozaika/mz-48'],
  [14,4,1,'vo-mozaika/mz-49'],
  [15,0,1,'vo-mozaika/mz-50'],
  [15,3,1,'vo-mozaika/mz-51'],
  [15,4,1,'vo-mozaika/mz-52']
]/*/OKNA*/;
  var RYADY = 5, KOLONKI = 16;

  /* Всё считаем в пикселях кадра 4К, на экран переводим множителем k. */
  var W = 3840, H = 2160, G = 15;          /* щель: при 15 все размеры целые */
  var CH = (H - (RYADY + 1) * G) / RYADY;      /* клетка: 414 */
  var CW = CH * 16 / 9;                        /* 736 */
  var SHAG = CW + G;
  var L = KOLONKI * SHAG;                      /* через столько мозаика повторяется */

  var q = new URLSearchParams(location.search);
  /* Не ?v= — этим хвостом у нас сбрасывают кэш (?v=<время>), скорость улетела бы. */
  var v = parseFloat(q.get('skorost')) || 240;  /* пикселей 4К в секунду */
  v = Math.max(20, Math.min(3000, v));

  var kadr = document.getElementById('kadr');
  var podskazka = document.getElementById('podskazka');
  var k = 1, pos = 0, stoit = false;

  var okna = OKNA.map(function(o){
    var el = document.createElement('div');
    el.className = 'o' + (o[2] > 1 ? ' b' : '');
    var vid = document.createElement('video');
    vid.muted = true; vid.defaultMuted = true; vid.loop = true; vid.playsInline = true;
    vid.setAttribute('muted', ''); vid.setAttribute('playsinline', '');
    vid.preload = 'auto';
    vid.poster = o[3] + '.webp';
    vid.src = o[3] + '.mp4';
    el.appendChild(vid);
    kadr.appendChild(el);
    return {
      el: el, vid: vid, igraet: false,
      x0: o[0] * SHAG, y: G + o[1] * (CH + G),
      w: o[2] * CW + (o[2] - 1) * G, h: o[2] * CH + (o[2] - 1) * G
    };
  });
  var MAXW = okna.reduce(function(m, o){ return Math.max(m, o.w); }, 0);

  /* ---------- загрузка: каждому окну своё случайное начало ---------- */
  var gotovo = 0;
  okna.forEach(function(o){
    o.vid.addEventListener('loadedmetadata', function(){
      var d = o.vid.duration;
      if (d > 1) o.vid.currentTime = Math.random() * (d - 1);
    }, {once:true});
    o.vid.addEventListener('canplaythrough', function(){
      gotovo++;
      if (gotovo < okna.length){
        podskazka.textContent = 'Загружаю ролики: ' + gotovo + ' из ' + okna.length;
      } else {
        podskazka.textContent = 'Готово. F - весь экран, пробел - пауза, ← → - скорость';
        setTimeout(function(){ podskazka.classList.add('skryt'); }, 3500);
      }
    }, {once:true});
  });

  /* ---------- кадр 16:9 вписан в окно ---------- */
  function vpisat(){
    var ww = window.innerWidth, wh = window.innerHeight;
    k = Math.min(ww / W, wh / H);
    var kw = W * k, kh = H * k;
    kadr.style.width = kw + 'px';
    kadr.style.height = kh + 'px';
    kadr.style.left = ((ww - kw) / 2) + 'px';
    kadr.style.top = ((wh - kh) / 2) + 'px';
    kadr.style.setProperty('--k', k);
    okna.forEach(function(o){
      o.el.style.width = (o.w * k) + 'px';
      o.el.style.height = (o.h * k) + 'px';
    });
    polozhit();
  }

  /* Каждое окно едет само и, уйдя за левый край, переезжает направо на длину
     мозаики. Так в странице ровно 52 ролика, без копий ленты: у Chrome
     предел на число видео на странице (около 75). */
  function polozhit(){
    for (var i = 0; i < okna.length; i++){
      var o = okna[i];
      var x = ((o.x0 - pos + MAXW) % L + L) % L - MAXW;
      o.el.style.transform = 'translate3d(' + (x * k).toFixed(2) + 'px,' + (o.y * k).toFixed(2) + 'px,0)';
      /* Играют только окна в кадре и на подъезде справа — остальные ждут. */
      var nado = x < W * 1.3 && x + o.w > 0;
      if (nado !== o.igraet){
        o.igraet = nado;
        if (nado){ var p = o.vid.play(); if (p && p.catch) p.catch(function(){}); }
        else o.vid.pause();
      }
    }
  }

  var last = 0;
  function tik(now){
    requestAnimationFrame(tik);
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (!stoit) pos += v * dt;
    polozhit();
  }

  /* ---------- клавиши и курсор ---------- */
  var tost = 0;
  function skazat(t){
    podskazka.textContent = t;
    podskazka.classList.remove('skryt');
    clearTimeout(tost);
    tost = setTimeout(function(){ podskazka.classList.add('skryt'); }, 1200);
  }
  document.addEventListener('keydown', function(e){
    if (e.code === 'KeyF'){
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function(){});
    } else if (e.code === 'Space'){
      e.preventDefault();
      stoit = !stoit;
      skazat(stoit ? 'Пауза' : 'Поехали');
    } else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft'){
      v = Math.round(v * (e.code === 'ArrowRight' ? 1.25 : 0.8));
      v = Math.max(20, Math.min(3000, v));
      skazat('Скорость ' + v);
    }
  });
  var mysh = 0;
  document.addEventListener('mousemove', function(){
    document.body.classList.remove('tiho');
    clearTimeout(mysh);
    mysh = setTimeout(function(){ document.body.classList.add('tiho'); }, 1500);
  });
  document.body.classList.add('tiho');

  window.addEventListener('resize', vpisat);
  vpisat();
  requestAnimationFrame(tik);
})();
</script>
</body>
</html>
